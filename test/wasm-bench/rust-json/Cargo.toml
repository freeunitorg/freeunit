[package]
name = "wasm-bench-rust-json"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasi = "0.14.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
strip = true

[workspace]
