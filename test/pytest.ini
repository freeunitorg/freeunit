[pytest]
addopts = -vvv -s --print-log --durations=25
python_functions = test_*
# A test that runs longer than this prints every thread's stack to stderr.
# It stops nothing. The slowest passing test in CI takes about 121 s
# (test/test_proxy_header_timeout.py). A hung test shows its name and the
# call it is stuck in before the step timeout ends it.
faulthandler_timeout = 150
