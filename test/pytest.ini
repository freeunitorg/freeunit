[pytest]
addopts = -vvv -s --print-log --durations=25
python_functions = test_*
# A test that runs longer than this prints every thread's stack to stderr.
# It stops nothing. The slowest passing test in CI takes 36 s. A hung test
# shows its name and the call it is stuck in before the step timeout ends it.
faulthandler_timeout = 120
