id: memcpy-computed-size
valid:
  - |
    void f(char *dst, char *src, size_t n) {
        memcpy(dst, src, n);
    }
  - |
    #define COPY(dst, src, n)  do { memcpy(dst, src, n); off += n + 1; } while (0)
invalid:
  - |
    void f(char *dst, char *src, size_t a, size_t b) {
        memcpy(dst, src, a + b);
    }
  - |
    #define COPY(dst, src, n)  do { memcpy((char *) dst + off, src, n + 1); } while (0)
  - |
    void f(char *dst, char *src, size_t n) {
        nxt_memcpy(dst, src, n + 1);
    }
