id: shm-double-fetch
valid:
  - |
    void f(nxt_port_msg_t *msg, size_t max) {
        size_t len;

        len = msg->len;

        if (len > max) {
            return;
        }

        use(len);
    }
invalid:
  - |
    void f(nxt_port_msg_t *msg, size_t max) {
        size_t len;

        if (msg->len > max) {
            return;
        }

        len = msg->len;
    }
  - |
    void f(nxt_port_msg_t *msg, size_t max) {
        size_t len;

        if (max < msg->len)
            return;

        other();
        len = msg->len;
    }
  - |
    void f(nxt_unit_response_t *resp, size_t count) {
        nxt_unit_field_t  *f;

        if (nxt_slow_path(count < resp->fields_count)) {
            return;
        }

        for (f = resp->fields; f < resp->fields + resp->fields_count; f++) {
            use(f);
        }
    }
