id: must-check-results
language: c
severity: error
message: >-
  The return value of this call is not checked. nxt_port_socket_write2(),
  nxt_port_mmap_get_buf(), nxt_app_queue_send() and nxt_port_queue_send() all
  report failure (a negative return, or NULL for the mmap buffer getter) that
  the caller must act on; a bare-statement call throws that signal away.
rule:
  any:
    - pattern: nxt_port_socket_write2($$$);
    - pattern: nxt_port_mmap_get_buf($$$);
    - pattern: nxt_app_queue_send($$$);
    - pattern: nxt_port_queue_send($$$);
