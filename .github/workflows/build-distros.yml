name: "Build (Fedora/Alpine · GCC/Clang)"

on:
  # Rolling distributions break on their own schedule, not on ours, so this is
  # a weekly gate rather than a PR gate: Fedora rawhide and Alpine edge move
  # under us between pull requests, and a red check nobody caused is a check
  # nobody reads.  A failure opens or updates a tracking issue instead.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:

  fedora-rawhide:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        compiler: [ 'gcc', 'clang' ]

    container:
      image: fedora:rawhide

    steps:
      - name: Install tools/deps
        run: |
          dnf -y update
          dnf -y install --setopt=install_weak_deps=False \
              which wget git gcc make pcre2-devel openssl-devel \
              zlib-ng-compat-devel libzstd-devel brotli-devel \
              python-unversioned-command python3 python3-devel \
              php-devel php-embedded perl-devel perl-ExtUtils-Embed \
              ruby-devel java-devel nodejs-devel nodejs-npm golang \
              cargo rust cmake
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            dnf -y install --setopt=install_weak_deps=False clang
          fi
          npm install -g node-gyp

      - uses: actions/checkout@v5

      - name: configure unit CC=${{ matrix.compiler }}
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            ./configure --openssl --otel --zlib --zstd --brotli --tests --cc=clang
          else
            ./configure --openssl --otel --zlib --zstd --brotli --tests
          fi

      - name: make unit
        run: make -j 4

      - name: configure unit-php
        run: ./configure php

      - name: make unit-php
        run: make -j 4 php

      - name: configure unit-python
        run: ./configure python

      - name: make unit-python
        run: make -j 4 python

      - name: configure unit-perl
        run: ./configure perl
        if: matrix.compiler == 'gcc'

      - name: make unit-perl
        run: make -j 4 perl
        if: matrix.compiler == 'gcc'

      - name: configure unit-ruby
        run: ./configure ruby

      - name: make unit-ruby
        run: make -j 4 ruby

      - name: configure unit-java
        run: ./configure java

      - name: make unit-java
        run: make -j 4 java

      - name: configure unit-nodejs
        run: ./configure nodejs

      - name: make unit-nodejs
        run: make node-local-install DESTDIR=node

      - name: configure unit-go
        run: ./configure go --go-path=

      - name: make unit-go
        run: make go-install

      # wasmtime version is pinned in pkg/contrib/src/wasmtime/version and
      # built from a checksum-verified source tarball — same as build-test.
      # Keeps the wasm runtime in sync with what Unit is actually built against.
      # Cache the compiled artifacts (keyed by the pinned version + this distro,
      # so it never mixes with the ubuntu/debian glibc builds) to skip the slow
      # from-source compile on a hit.
      - name: Cache wasmtime
        id: cache-wasmtime
        uses: actions/cache@v6
        with:
          path: pkg/contrib/wasmtime/artifacts
          key: wasmtime-fedora-rawhide-${{ runner.arch }}-${{ hashFiles('pkg/contrib/src/wasmtime/version') }}

      - name: Build wasmtime (pinned via pkg/contrib)
        if: steps.cache-wasmtime.outputs.cache-hit != 'true'
        run: make -C pkg/contrib .wasmtime

      - name: configure unit-wasm
        run: ./configure wasm --include-path=pkg/contrib/wasmtime/artifacts/include --lib-path=pkg/contrib/wasmtime/artifacts/lib --rpath

      - name: make unit-wasm
        run: make wasm

  alpine-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        compiler: [ 'gcc', 'clang' ]

    container:
      image: alpine:edge

    steps:
      - name: Install tools/deps
        run: |
          apk update && apk upgrade
          apk add gcc make musl-dev openssl-dev pcre2-dev curl \
              zlib-dev zstd-dev brotli-dev \
              php83-dev php83-embed python3-dev perl-dev ruby-dev \
              openjdk21-jdk cargo rust
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            apk add clang
          fi

      - uses: actions/checkout@v5

      - name: configure unit CC=${{ matrix.compiler }}
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            ./configure --openssl --otel --zlib --zstd --brotli --tests --cc=clang
          else
            ./configure --openssl --otel --zlib --zstd --brotli --tests
          fi

      - name: make unit
        run: make -j 4

      - name: configure unit-php
        run: |
          ln -s /usr/lib/libphp83.so /usr/lib/libphp.so
          ./configure php --config=/usr/bin/php-config83

      - name: make unit-php
        run: make -j 4

      - name: configure unit-python
        run: ./configure python

      - name: make unit-python
        run: make -j 4

      - name: configure unit-perl
        run: ./configure perl

      - name: make unit-perl
        run: make -j 4 perl

      - name: configure unit-ruby
        run: ./configure ruby

      - name: make unit-ruby
        run: make -j 4 ruby

      - name: configure unit-java
        run: ./configure java

      - name: make unit-java
        run: make -j 4 java

  # A weekly red check that nobody caused is a check nobody reads, so a
  # scheduled failure is reported as a tracking issue instead, the same way
  # eol-check.yml handles its weekly run.
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ fedora-rawhide, alpine-edge ]
    if: failure() && github.event_name == 'schedule'

    steps:
      - name: Open or update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          # This job does not check out the repository, so gh has no local git
          # remote to infer the target from and would exit before creating the
          # issue -- silently defeating the point of the job.
          GH_REPO: ${{ github.repository }}
        run: |
          title='Rolling distro build is failing (Fedora rawhide / Alpine edge)'
          {
            echo 'The weekly rolling-distribution build failed. These distributions'
            echo 'move between our pull requests, so a failure here is usually a'
            echo 'toolchain or package change rather than a regression in Unit.'
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo 'Reproduce locally, e.g. for Alpine:'
            echo
            echo '```'
            echo 'docker run --rm -it --platform linux/amd64 alpine:edge sh'
            echo '```'
          } > issue-body.md
          existing=$(gh issue list --state open --search "in:title ${title}" \
            --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -n1)
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body-file issue-body.md
          else
            gh issue create --title "${title}" --body-file issue-body.md
          fi
