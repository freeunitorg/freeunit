# TEMPORARY: checks which Ubuntu mirrors resolve and serve apt on the hosted
# runners, on the host and inside Docker.  Not for merge.
name: "zz probe runners"

on:
  push:
    branches: [ claude/freeunit-c-vulnerabilities-perf-mvssit ]
    paths: [ '.github/workflows/zz-probe-runners.yml' ]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-24.04, ubuntu-26.04 ]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Resolver
        run: |
          cat /etc/resolv.conf || true
          resolvectl status 2>/dev/null | head -20 || true
          cat /etc/apt/apt-mirrors.txt 2>/dev/null || true

      - name: Host DNS and HTTP
        run: |
          for h in azure.archive.ubuntu.com archive.ubuntu.com \
                   security.ubuntu.com ports.ubuntu.com \
                   archive.archive.ubuntu.com security.archive.ubuntu.com \
                   mirrors.edge.kernel.org mirror.leaseweb.net \
                   ftp.halifax.rwth-aachen.de mirrors.kernel.org \
                   deb.debian.org github.com; do
            ip=$(getent ahostsv4 "$h" | awk 'NR==1{print $1}')
            code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "http://$h/" || echo ERR)
            echo "$h ip=${ip:-NONE} http=$code"
          done

      - name: Host apt via the default mirrors
        run: sudo apt-get update 2>&1 | tail -5

      - name: Host apt via mirrors.edge.kernel.org
        run: |
          . /etc/os-release
          echo "deb http://mirrors.edge.kernel.org/ubuntu $VERSION_CODENAME main" \
            | sudo tee /etc/apt/sources.list.d/probe.list
          sudo apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/probe.list \
            -o Dir::Etc::sourceparts=- 2>&1 | tail -5

      - name: Docker xenial (the cross image) with fallback mirrors
        if: always()
        timeout-minutes: 5
        run: |
          docker run --rm ghcr.io/cross-rs/aarch64-unknown-linux-gnu:0.2.5 sh -c '
            cat /etc/apt/sources.list | grep -v "^#" | grep . | sort -u
            sed -i -e "s#http://[a-z.]*archive.ubuntu.com/ubuntu#http://mirrors.edge.kernel.org/ubuntu#" \
                   -e "s#http://ports.ubuntu.com/ubuntu-ports#http://ftp.halifax.rwth-aachen.de/ubuntu-ports#" \
                   /etc/apt/sources.list $(ls /etc/apt/sources.list.d/*.list 2>/dev/null)
            dpkg --add-architecture arm64
            grep -rh "^deb" /etc/apt/sources.list /etc/apt/sources.list.d/ | sort -u
            dpkg --add-architecture arm64
            apt-get update 2>&1 | tail -12
            apt-get install --assume-yes libssl-dev:arm64 2>&1 | tail -2' 2>&1 | tail -30

      - name: Host apt with the mirror list replaced
        if: false
        timeout-minutes: 5
        run: |
          if ! getent hosts archive.ubuntu.com > /dev/null; then
            printf 'http://mirrors.edge.kernel.org/ubuntu/\tpriority:1\n' \
              | sudo tee /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update 2>&1 | tail -6
          sudo apt-get install -y --no-install-recommends xsltproc dwarves 2>&1 | tail -3
