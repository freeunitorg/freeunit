name: "Sanitize (ASan+UBSan)"

# Sanitizer gate for the graceful-shutdown lifecycle paths (SIGQUIT teardown,
# two-phase listener drain, static teardown) plus per-runtime request handling.
# Builds unitd + one language module with AddressSanitizer +
# UndefinedBehaviorSanitizer and runs that runtime's subset, so use-after-free
# / null-deref / UB in the connection-close, listener-close, and module
# request/teardown paths surface in CI. Closes the P4 acceptance criterion for
# the graceful-shutdown roadmap and de-risks the P5 connection-drain work.
#
# One matrix leg per runtime.  Adding a runtime is a single `include` entry:
# its extra apt packages (or a setup step, see PHP), the `configure`/`make`
# module arguments, and the test files to run under the sanitizer.  The
# runtime-agnostic teardown coverage (graceful/listener/static) rides the
# python leg because its drivers need the python module.

on:
  pull_request:
    paths:
      - configure
      - version
      - 'auto/**'
      - 'go/**'
      - 'src/**'
      - 'test/**'
      # The gate is three files, not one: a change to the scan script or to
      # the waiver list can break report detection or widen what is ignored
      # just as effectively as a change to this workflow, and must not skip
      # the job that would catch it.
      - '.github/workflows/sanitize.yml'
      - '.github/scripts/check-sanitizer-reports.sh'
      - '.github/sanitizer-allowlist.txt'
  push:
    # master is the release/default branch; pre-* are the release-prep
    # integration branches (e.g. pre-1.35.6) where the hardening actually
    # lands.  PRs to either are already covered by the unfiltered
    # pull_request trigger above.
    branches:
      - master
      - 'pre-*'
    paths:
      - configure
      - version
      - 'auto/**'
      - 'go/**'
      - 'src/**'
      - 'test/**'
      # The gate is three files, not one: a change to the scan script or to
      # the waiver list can break report detection or widen what is ignored
      # just as effectively as a change to this workflow, and must not skip
      # the job that would catch it.
      - '.github/workflows/sanitize.yml'
      - '.github/scripts/check-sanitizer-reports.sh'
      - '.github/sanitizer-allowlist.txt'

jobs:
  sanitize:
    name: "sanitize (${{ matrix.runtime }})"
    runs-on: ubuntu-latest

    # NOTE: `continue-on-error` is deliberately NOT set at job level here.
    # It is set on every step an experimental leg can fail in: the
    # runtime-specific configure/make steps, the Go package install, the test
    # run and the gate.  Anything earlier -- apt, the core unitd build -- is
    # shared infrastructure, and a failure there is a real problem on every
    # leg rather than something the experimental runtime is allowed to have.
    # Job-level continue-on-error only stops the WORKFLOW RUN from failing; the
    # job keeps its own `failure` conclusion, GitHub creates one check run per
    # matrix job mirroring it, and the check still shows red in the PR rollup.
    # To make an experimental leg genuinely non-blocking the flag has to be on
    # the steps that can fail -- see the run and gate steps below.

    # Blocking on purpose: this job exists to red-line lifecycle teardown
    # regressions.  Its first run caught the controller's raw c->link unlinks
    # desyncing c->idle from the tracking queues, crashing every --debug build
    # on every control-socket close (fixed in "fix(controller): coherent conn
    # tracking").  fail-fast is off so one runtime's failure does not cancel
    # the others.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: python
            apt: python3-dev libpython3-dev
            configure: python --config=python3-config
            make: python3
            # --restart is required here: test_graceful_reload.py signals the
            # unitd master and self-skips without it.  It also makes conftest
            # rmtree the temp dir on teardown, which is fine for these tests.
            pytest_opts: "--restart"
            # test_static and test_conn_recycle are module-free; the
            # graceful/listener drivers need the python module, so the shared
            # teardown coverage lives here.  test_conn_recycle exercises the
            # connection-struct freelist recycler under ASan (recycle churn +
            # engine teardown at listen_threads reconfig).
            #
            # test_conn_task_race drives a send-timeout mid-stream RST abort
            # straddling keep-alive reuse (freeunit#156): pre-fix a deferred
            # conn write item dereferenced a freed request-pool task, which
            # this leg's ASan build reports as a heap-use-after-free.
            #
            # test_proxy covers the upstream (peer) connection lifecycle, which
            # only this leg can red-line: the peer teardown paths free the peer
            # object out of the request pool while conn events may still be
            # queued (nxt_h1p_peer_close), and the connection-task ownership
            # assertions are nxt_assert()s, live only in the --debug build
            # configured below.  In the release test legs both the assertions
            # and ASan's report are compiled out.
            #
            # test_chunked's split-read case drives a chunked request body whose
            # framing arrives in its own segments, which is how the request read
            # buffer reaches the parser's recycle path.  Without ASan a stale
            # buffer is usually silently reused, so only this leg turns that
            # back into a hard failure.
            #
            # test_app_lifecycle drives the APPLICATION process's libunit
            # port/fd lifecycle (process-count churn, control restart storms,
            # whole-application remove/re-add, churn under keep-alive).  The
            # language module is linked into the app process with the same
            # instrumentation as unitd, so a double close(), a use-after-free
            # of an nxt_unit_port_t or a stale descriptor in libunit becomes a
            # hard ASan failure here instead of an intermittent "[alert]" line
            # in one runtime's log.  It self-skips every runtime that is not
            # built into this leg's unitd.
            tests: >-
              test/test_graceful_reload.py
              test/test_listener_drain.py
              test/test_static.py
              test/test_conn_task_race.py
              test/test_proxy.py
              test/test_chunked.py
              test/test_conn_recycle.py
              test/test_app_lifecycle.py
          - runtime: php
            apt: ""
            configure: php
            make: php
            # No --restart: test_php_application.py does not signal the master,
            # and --restart's teardown rmtree trips on test_php_application_
            # forbidden's restricted-permission fixture (rmtree PermissionError).
            pytest_opts: ""
            tests: >-
              test/test_php_application.py
              test/test_app_lifecycle.py
          # Go is where the app-side port-fd double-close actually manifested
          # (a flaky "close(N) failed: Bad file descriptor" in the go isolation
          # leg) and it is the only module that registers libunit add_port /
          # remove_port callbacks, i.e. the only one that exercises the
          # ownership handoff those callbacks create.  Running its churn tests
          # under ASan turns a silently-reused descriptor into a hard failure.
          #
          # experimental: cgo + ASan is a new combination for this repo (the Go
          # binary links the sanitized libunit.a through cgo).  Kept
          # non-blocking for its first green runs; drop `experimental` once it
          # is stable.
          - runtime: go
            apt: ""
            configure: go --go-path=
            make: go
            pytest_opts: ""
            experimental: true
            tests: >-
              test/test_go_application.py
              test/test_app_lifecycle.py

    steps:
      - uses: actions/checkout@v5

      # Base tools + pytest (needed to run any leg) plus this runtime's extra
      # apt packages.  Runtimes whose toolchain is not in apt add a setup step
      # instead (see PHP below) and leave `apt` empty.
      - name: Install packages
        run: |
          sudo apt-get -y update
          sudo apt-get -y install build-essential libpcre2-dev libssl-dev \
                                  python3-pytest ${{ matrix.apt }}

      # PHP's toolchain (php-config, embed SAPI) comes from setup-php rather
      # than apt.  A future runtime that needs a dedicated setup action adds a
      # similarly-gated step here; apt-based runtimes need nothing extra.
      - name: Set up PHP
        if: matrix.runtime == 'php'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          # Base extension set mirrored from the skilldlabs/php:85 image
          # (a production PHP 8.5), so the sanitized module test exercises a
          # realistic extension surface.  Plus mysqli and pdo_pgsql (DB
          # drivers used in production, not in the base image).  xdebug is
          # intentionally omitted: it is disabled by default in that image and
          # its execution hooks only add overhead and noise under the sanitizer.
          extensions: >-
            apcu, brotli, igbinary, uploadprogress,
            bcmath, ctype, curl, dom, fileinfo, gd, gmp, iconv, mbstring,
            mysqli, openssl, pcntl, pdo_mysql, pdo_pgsql, pdo_sqlite, phar,
            session, simplexml, sqlite3, tokenizer, xml, xmlreader, xmlwriter,
            zip
        env:
          update: true

      # Sanitizer flags ride the tree's --cc-opt / --ld-opt (NXT_CC_OPT /
      # NXT_LD_OPT).  --cc-opt lands after the built-in -O so -O1 wins;
      # --debug keeps readable crash context.  auto/save records the flags
      # into build/autoconf.data, so the module configured below inherits the
      # same instrumentation -- no ASan interceptor/ODR mismatch.
      #
      # detect_leaks=0 for configure: auto/feature compiles AND RUNS its
      # probes, and some intentionally leak (e.g. auto/malloc's Linux
      # malloc_usable_size() probe mallocs without freeing).  With LeakSanitizer
      # on, such a probe exits nonzero, auto/feature records it "found but is
      # not working", and the feature is silently dropped -- so the sanitized
      # build would configure different code paths than a normal build.  Turn
      # LSan off for the probe run to keep the feature set faithful.
      - name: Configure unit (ASan+UBSan)
        env:
          ASAN_OPTIONS: "detect_leaks=0"
        run: |
          ./configure \
            --debug \
            --tests \
            --openssl \
            --cc-opt="-fsanitize=address,undefined -fno-omit-frame-pointer -O1" \
            --ld-opt="-fsanitize=address,undefined"

      - name: Make unit
        run: make -j$(nproc) unitd

      # --tests above only makes this target available; the default target
      # does not build it.  Without it the `libunit` parameter of
      # test_app_lifecycle.py self-skips, and the runtime that links libunit
      # directly -- the one worth the most under a sanitizer, since nothing
      # else sits between the test and the port/fd paths -- would be absent
      # from precisely the legs built to instrument them.
      - name: Make the libunit test application
        run: make -j$(nproc) build/unit_app_test

      # Same probe-leak rationale as the core configure step above.
      - name: Configure ${{ matrix.runtime }} module
        continue-on-error: ${{ matrix.experimental == true }}
        env:
          ASAN_OPTIONS: "detect_leaks=0"
        run: ./configure ${{ matrix.configure }}

      - name: Make ${{ matrix.runtime }} module
        continue-on-error: ${{ matrix.experimental == true }}
        run: make -j$(nproc) ${{ matrix.make }}

      # The Go package is consumed from build/go/src/unit.nginx.org/go by
      # test/unit/applications/lang/go.py (it writes a go.mod `replace`
      # pointing there), so the test apps only build after go-install.  The
      # generated env.go carries the tree's --cc-opt/--ld-opt into cgo, which
      # is how the sanitized libunit.a reaches the Go app process.
      - name: Install Go package
        continue-on-error: ${{ matrix.experimental == true }}
        if: matrix.runtime == 'go'
        run: make go-install

      # ASAN_OPTIONS / UBSAN_OPTIONS are step-level env so pytest and every
      # forked unitd process inherit them.
      #   detect_leaks=0
      #     the fork-heavy daemon makes LeakSanitizer extremely noisy; turning
      #     leak detection on is tracked as a follow-up, once the teardown
      #     paths are use-after-free / null-deref clean.
      #   print_stacktrace
      #     honoured wherever the options string survives.  It does NOT take
      #     effect inside unitd itself -- see the header of
      #     .github/scripts/check-sanitizer-reports.sh -- which is exactly why
      #     the gate below reads unit.log instead of trusting a log_path
      #     directory.  Kept because it costs nothing and does apply to the
      #     application processes a `"type": "external"` module execve()s,
      #     which start a fresh sanitizer runtime with the options intact.
      #     halt_on_error is deliberately NOT set, for that same reason: in an
      #     exec'd app process it is live, and it aborts the worker on the
      #     FIRST violation -- including ones the allowlist waives, since that
      #     list is a post-hoc log scan and cannot stop a runtime abort.  With
      #     it on, the known nxt_cpymem() zero-length copy (issue #200) killed
      #     the Go app mid-response and failed unrelated tests with a missing
      #     response header.  Unwaived reports are failed by the gate step
      #     below, which is the mechanism that is actually load-bearing.
      #
      # --save-log keeps <temp_dir>/unit.log after each test.  Without it
      # test/conftest.py removes the per-restart temp dir, and with it the only
      # copy of any report a forked daemon wrote -- which is what the gate
      # below scans.  pytest_opts is per-runtime (e.g. --restart for the
      # graceful tests).
      - name: Run ${{ matrix.runtime }} sanitizer subset
        continue-on-error: ${{ matrix.experimental == true }}
        env:
          ASAN_OPTIONS: "detect_leaks=0"
          UBSAN_OPTIONS: "print_stacktrace=1"
        run: |
          set -o pipefail
          python3 -m pytest -v --save-log ${{ matrix.pytest_opts }} \
            ${{ matrix.tests }} | tee "${RUNNER_TEMP}/pytest.out"

      # A leg in which every test skipped exits 0, writes clean logs, and is
      # therefore green -- indistinguishable from one that ran and passed.
      # That is how a module which failed to build hides: check_*() marks the
      # runtime unavailable at session start, every parametrized test skips,
      # and nothing anywhere says so.  It matters most for a leg being
      # watched for "first green runs" before dropping `experimental`, where
      # a skipped-everything green is precisely the wrong signal.
      - name: Fail on an empty test run
        if: always()
        continue-on-error: ${{ matrix.experimental == true }}
        run: |
          if [ ! -s "${RUNNER_TEMP}/pytest.out" ]; then
            echo "::error::The ${{ matrix.runtime }} leg produced no pytest" \
                 "output; the run step did not get that far."
            exit 1
          fi

          # The pass has to belong to THIS runtime.  A bare "N passed" is
          # satisfied by the runtime-agnostic parameters that run in every
          # leg -- libunit above all, which needs no language toolchain and
          # so passes even when this leg's own module failed to build and
          # every one of its tests skipped.  That is the precise condition
          # this guard exists to catch, so it looks for a passing test
          # parametrized with the runtime's own name.
          if ! grep -qE "\[${{ matrix.runtime }}\].*PASSED" \
               "${RUNNER_TEMP}/pytest.out"; then
            echo "::error::No ${{ matrix.runtime }} test passed in the" \
                 "${{ matrix.runtime }} leg. Its tests skipped or errored," \
                 "which exits 0 and would otherwise report this leg green" \
                 "while covering nothing of the runtime it is named for."
            tail -30 "${RUNNER_TEMP}/pytest.out"
            exit 1
          fi

      - name: Upload unit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-logs-${{ matrix.runtime }}
          path: ${{ env.TMPDIR || '/tmp' }}/unit-test-*/unit.log
          if-no-files-found: warn

      # Sanitizer reports do not reliably fail pytest.  A UBSan violation that
      # does not escalate to a signal fails nothing at all: the harness's
      # Log.check_alerts() greps unit.log for "[alert]" and "Sanitizer", not
      # for UBSan's "runtime error:".  An ASan report does abort the router,
      # but the session then fails with connection errors that read as an
      # infrastructure flake rather than as a memory-safety bug.  Measured on
      # master: 24 runs of the configuration-churn workload produced a UBSan
      # violation in every run with pytest green in 23 of them, and the one
      # ASan heap-use-after-free surfaced only as "Client can't connect to the
      # server".  Fail the job explicitly on what the logs actually contain.
      - name: Fail on sanitizer reports
        if: always()
        continue-on-error: ${{ matrix.experimental == true }}
        run: |
          .github/scripts/check-sanitizer-reports.sh \
            "${TMPDIR:-/tmp}" .github/sanitizer-allowlist.txt
