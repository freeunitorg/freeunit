name: "Lint (Whitespace)"

# Get the repo with the commits(+1) in the series.
# Process `git log --check` output to extract just the check errors.

on:
  pull_request:
    types: [ opened, synchronize ]
  push:
    branches: [ master ]
    # Release tags, for the version check below.  The whitespace step
    # skips a tag: its commits were checked when they were pushed.
    tags: [ '[0-9]+.[0-9]+.[0-9]+' ]

concurrency:
  # Cancel superseded runs for the same pull request.  Non-PR events fall back
  # to the run id, which is unique, so a push is never grouped with another:
  # Actions keeps only one PENDING run per group and would drop a queued commit
  # even with cancel-in-progress false, which would break bisectability.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-whitespace:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Test the commit-check baseline selection
      run: sh .github/scripts/check-base-test.sh

    - name: git log --check
      id: check_out
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        # After a branch is replaced, its old tip is not an ancestor. Then
        # only the last commit is checked, so that errors already removed
        # in the imported history do not fail the job.
        base=$(sh .github/scripts/check-base.sh "$BASE")
        if test -n "$base"
        then
          range="${base}..HEAD"
        else
          # A root commit has no parent; check its additions directly.
          range="HEAD"
        fi

        # Run git log before the loop, so that its failure fails the step.
        # It exits 2 when it finds a whitespace error; the loop reports it.
        rc=0
        git log --check --pretty=format:"--- %h %s" ${range} \
          > "${RUNNER_TEMP}/check.log" || rc=$?
        if test "${rc}" -ne 0 && test "${rc}" -ne 2
        then
          echo "::error::git log ${range} failed with exit status ${rc}."
          exit 1
        fi

        log=
        commit=
        while read dash etc
        do
          case "${dash}" in
          "---")
            commit="${etc}"
            ;;
          "")
            ;;
          *)
            if test -n "${commit}"
            then
              log="${log}\n${commit}"
              echo ""
              echo "--- ${commit}"
            fi
            commit=
            log="${log}\n${dash} ${etc}"
            echo "${dash} ${etc}"
            ;;
          esac
        done < "${RUNNER_TEMP}/check.log"

        if test -n "${log}"
        then
          exit 2
        fi

    # Every file that carries the release version agrees with the version
    # file, and the generated Dockerfiles are up to date.  It needs no
    # network.  It runs even when the whitespace check fails, and on every
    # event: pull requests, pushes to master and release tags.
    - name: Check the release version sites
      if: ${{ !cancelled() }}
      run: sh .github/scripts/check-version.sh

    # The generated files in the tree must match their sources.  The
    # changelog comes from docs/changes.xml, and every PHP Dockerfile must
    # carry the ini fragment of the Makefile.  It needs the network only for
    # the packages.  It runs even when the whitespace check fails.
    - name: Check the generated files
      if: ${{ !cancelled() }}
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends xsltproc libxml2-utils
        make -C docs check
        make -C pkg/docker check
