
name: "Build & Release (unitctl)"

on:
  pull_request:
    paths:
      - tools/unitctl/**
      - docs/unit-openapi.yaml
      # A change to this file must run this file.  Without it a pull request
      # that only edits the workflow is never checked by it.
      - .github/workflows/unitctl.yml
  push:
    branches:
      - master
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: "Semver tag"
        required: true

permissions:
  contents: write

concurrency:
  # Cancel superseded runs for the same pull request.  Non-PR events fall back
  # to the run id, which is unique, so a push is never grouped with another:
  # Actions keeps only one PENDING run per group and would drop a queued commit
  # even with cancel-in-progress false, which would break bisectability.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tools/unitctl
    env:
      MAKE: make
      CARGO: cargo
      VERSION:
      SHORT_VERSION:
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - build: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5

      - run: rustup update stable
      - run: rustup target add ${{ matrix.target }}

      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install macOS depedencies
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install make gnu-sed grep gawk
          echo "MAKE=gmake" >> $GITHUB_ENV

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - run: ${{ env.MAKE }} list-targets

      - name: Generate openapi
        run: ${{ env.MAKE }} openapi-generate
      - name: Test ${{ matrix.os }}
        run: ${{ env.MAKE }} test

  musl:
    # The only leg that compiles unitctl without the "tls" feature.  The
    # feature-off code -- the #[cfg(not(feature = "tls"))] blocks and the test
    # that an "https://" control socket is refused -- is built nowhere else, so
    # without this job it can break and no run would say so.
    #
    # The musl target is also the one shipped without TLS, because TLS is what
    # pulls in aws-lc-sys and its C toolchain.
    #
    # What this job does not cover: every runner has a gnu host, so a musl
    # *host* -- "make release" on Alpine -- is not built here.  The make rule
    # for that host is checked below instead, which is the part that can be
    # checked without a musl runner.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/unitctl
    steps:
      - uses: actions/checkout@v5

      - run: rustup update stable
      - run: rustup target add x86_64-unknown-linux-musl

      # The build needs the generated OpenAPI client, which is produced by a
      # Java tool.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The GNUmakefile drops the default features for a musl target, so this
      # is the feature-off build.
      - name: Make unitctl (x86_64-unknown-linux-musl)
        run: make x86_64-unknown-linux-musl

      # Assert on the binary, not on the build log.  Without TLS there is no
      # aws-lc-sys, so the binary carries no aws_lc symbol.  The symbol count is
      # checked first, because a stripped binary would make the aws_lc test pass
      # while proving nothing.
      #
      # A program that links a C library needs an interpreter to load it, so the
      # absence of a PT_INTERP segment is what says none was linked.  readelf
      # names the segment; "file" would say "static-pie linked", which is that
      # tool's wording and changes with the runner image.
      - name: Check the binary carries no TLS stack
        run: |
          bin=target/x86_64-unknown-linux-musl/release/unitctl
          file "$bin"
          test "$(nm "$bin" | wc -l)" -gt 1000
          ! nm "$bin" | grep -q aws_lc
          ! readelf -lW "$bin" | grep -q INTERP

      # The claim behind the musl build is that TLS is the only thing needing a
      # C toolchain.  This runner has cc and cmake, so the job cannot show that
      # a build works without them.  What it can show is that no crate which
      # would use them is in the feature-off graph.  The line count guards
      # against an empty tree passing the grep.
      - name: Check no C-building crate is in the graph
        run: |
          tree=$(cargo tree --no-default-features \
            --target x86_64-unknown-linux-musl --edges normal,build)
          test "$(echo "$tree" | wc -l)" -gt 50
          ! echo "$tree" | grep -E '(^|[^a-z-])(cc|cmake|aws-lc-sys) v'

      # Run the host tests in the same feature state, so the feature-off
      # branches are executed and not merely compiled.
      - name: Test without the tls feature
        run: cargo test --no-default-features

      # The step above stays green if the refusal test is deleted or marked
      # #[ignore].  Name the test and require that one test ran: a filter that
      # matches nothing also reports "ok", with "0 passed".
      - name: Check the https refusal test ran
        run: |
          cargo test --no-default-features -p unit-client-rs \
            control_socket_address::tests::refuses_https_without_the_tls_feature \
            -- --exact | tee result.log
          grep -q 'test result: ok. 1 passed' result.log
          rm result.log

      # A native build on a musl host takes the same feature flag, by a
      # different rule (GNUmakefile HOST_TARGET).  No runner has a musl host,
      # so ask make what it would run.  Both directions are checked: a rule
      # that always passed the flag would break every gnu build.
      - name: Check the native musl build drops the feature too
        run: |
          make -n release HOST_TARGET=x86_64-unknown-linux-musl \
            | grep -q -- '--no-default-features'
          ! make -n release HOST_TARGET=x86_64-unknown-linux-gnu \
            | grep -q -- '--no-default-features'

  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/unitctl
    env:
      MAKE: make
      CARGO: cargo
      VERSION:
      SHORT_VERSION:
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - build: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - build: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - build: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v5

      - run: rustup update stable
      - run: rustup target add ${{ matrix.target }}

      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rust-${{ matrix.build }}
          workspaces: ./tools/unitctl -> target
          save-if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}

      - name: Configure linux arm dependencies
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          cat <<EOF > Cross.toml
          [target.aarch64-unknown-linux-gnu]
          pre-build = [
              "dpkg --add-architecture \$CROSS_DEB_ARCH",
              "apt-get update && apt-get install --assume-yes libssl-dev:\$CROSS_DEB_ARCH"
          ]
          EOF

          cat Cross.toml
          echo "CARGO=cross" >> $GITHUB_ENV

      - name: Install macOS dependencies
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install make gnu-sed grep gawk
          echo "MAKE=gmake" >> $GITHUB_ENV

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - run: ${{ env.MAKE }} list-targets

      - name: Make unitctl (${{ env.MAKE }}, ${{ matrix.target }})
        run: ${{ env.MAKE }} ${{ matrix.target }}

      - name: Get the version from the tag
        run: |
          version=${version:=${{ github.ref_name }}}
          short="${version#*/}"
          echo $version; echo $short
          echo "VERSION=$version" >> $GITHUB_ENV
          echo "SHORT_VERSION=$short" >> $GITHUB_ENV

      - name: Generate sha256 sum
        run: |
          shasum -a 256 ./target/${{ matrix.target }}/release/unitctl > unitctl-${{ env.SHORT_VERSION }}-${{ matrix.target }}.sha256
          mv ./target/${{ matrix.target }}/release/unitctl unitctl-${{ env.SHORT_VERSION }}-${{ matrix.target }}

      - name: Upload sha256 sum
        uses: actions/upload-artifact@v4
        with:
          name: unitctl-${{ env.SHORT_VERSION }}-${{ matrix.target }}.sha256
          path: tools/unitctl/unitctl-${{ env.SHORT_VERSION }}-${{ matrix.target }}.sha256

      - name: Upload unitctl
        uses: actions/upload-artifact@v4
        with:
          name: unitctl-${{ env.SHORT_VERSION }}-${{ matrix.target }}
          path: tools/unitctl/unitctl-${{ env.SHORT_VERSION }}-${{ matrix.target }}

  release:
    # Create a draft release if a tag
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "unitctl-*"
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          tag: ${{ inputs.version && format('unitctl/{0}', inputs.version) || format('unitctl/{0}', github.ref_name) }}
          body: >
            ## Unitctl

            This is a released binary of unitctl.

            Unitctl is an official command line tool for managing Unit installations.


            ## Unit

            For the current release of the FreeUnit application server (ex NGINX Unit) check the
            [FreeUnit repository](https://github.com/freeunitorg/freeunit) and the
            [FreeUnit releases](https://github.com/freeunitorg/freeunit/releases).

          allowUpdates: true
