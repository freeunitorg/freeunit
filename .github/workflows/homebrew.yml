name: "Homebrew"

# The repository is a Homebrew tap: HomebrewFormula links to pkg/brew.
# This workflow checks that the formula points at published files with the
# right checksums, and installs, tests and audits it on macOS.  The formula
# installs released files, not the pull request's source, so the workflow runs
# only when it changes, and once a week to catch a Homebrew change.

on:
  pull_request:
    paths:
      - 'pkg/brew/**'
      - HomebrewFormula
      - '.github/workflows/homebrew.yml'
  push:
    branches: master
    paths:
      - 'pkg/brew/**'
      - HomebrewFormula
      - '.github/workflows/homebrew.yml'
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # update.sh downloads every file the formula names and computes its
  # checksum.  Run for the version already in the formula, it must change
  # nothing.
  checksums:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check the formula against the release files
        run: |
          ver="$(sed -n 's#^ *url ".*/releases/download/\([0-9.]*\)/freeunit-.*#\1#p' pkg/brew/freeunit.rb | head -n 1)"
          sh pkg/brew/update.sh "$ver"
          git diff --exit-code pkg/brew

  formulae:
    needs: checksums
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-15, macos-15-intel ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@v7

      # A local tap holds a copy of the formula, so the job tests the files
      # of this commit and not the tap's default branch.
      - name: Put the formula in a local tap
        run: |
          brew tap-new --no-git freeunit/ci
          cp pkg/brew/*.rb "$(brew --repository freeunit/ci)/Formula/"

      - name: Style
        run: brew style --formula freeunit/ci/freeunit

      - name: Audit
        run: brew audit --formula --online freeunit/ci/freeunit

      - name: Install freeunit
        run: brew install --verbose freeunit/ci/freeunit

      - name: Test freeunit and unitctl
        run: brew test --verbose freeunit/ci/freeunit

      - name: Show the linked libraries
        run: otool -L "$(brew --prefix freeunit/ci/freeunit)/libexec/unitd"

